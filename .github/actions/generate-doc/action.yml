name: 'Generate Doc'
description: 'Builds the Antora documentation for lib/gil/doc'
runs:
  using: composite
  steps:
    - run: |
        # setup-boost copies the checkout (with .git, via `cp -a`) into
        # ../boost-root/libs/gil, so doc/ is nested under a real Boost
        # superproject there -- needed by build_antora.sh's BOOST_SRC_DIR
        # detection and by Antora's local content source.
        cd ../boost-root/libs/gil/doc
        bash build_antora.sh
        cd ..
        chmod +x $GITHUB_WORKSPACE/.github/actions/generate-doc/docs-config.sh
        $GITHUB_WORKSPACE/.github/actions/generate-doc/docs-config.sh
      shell: bash

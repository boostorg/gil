name: 'Generate Doc'
description: 'Builds the Antora documentation for lib/gil/doc'
runs:
  using: composite
  steps:
    - run: |
        # Antora's local content source (doc/local-playbook.yml: `url: ..`)
        # must be a real git repository. setup-boost's copy into
        # ../boost-root/libs/gil (via `cp -r`) drops .git, so the build must
        # run from the original checkout ($GITHUB_WORKSPACE) -- only
        # BOOST_SRC_DIR (cross-library headers for MrDocs) comes from
        # ../boost-root.
        export BOOST_SRC_DIR="$(cd ../boost-root && pwd)"
        pixi run -e docs docs-build
        chmod +x $GITHUB_WORKSPACE/.github/actions/generate-doc/docs-config.sh
        $GITHUB_WORKSPACE/.github/actions/generate-doc/docs-config.sh
      shell: bash

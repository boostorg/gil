source-root: ../include
compilation-database: ./CMakeLists.txt
file-patterns:
  - "*.hpp"
exclude:
  - ../include/boost/gil/extension/io
include-symbols:
  - "boost::gil::**"
exclude-symbols:
  - "boost::gil::detail"
  - "boost::gil::**::detail"

generator: adoc
multipage: true
sort-members: false
base-url: https://github.com/boostorg/gil/blob/master/include/
use-system-libc: true
warn-if-undocumented: false
warn-no-paramdoc: false
